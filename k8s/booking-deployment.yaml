apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
template:
  metadata:
    labels:
      app: booking-service
  spec:
    containers:
      - name: booking-service
        image: eventhive-booking:latest
        imagePullPolicy: Never
        ports:
          - containerPort: 8000
        env:
          - name: DB_HOST
            value: "mysql"
          - name: DB_PASSWORD
            value: "rootpassword"
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  selector:
    app: booking-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8000