apiVersion: v1
kind: ConfigMap
metadata:
  name: eventhive-config
data:
  DEBUG: "False"
  # Requests arrive with the Ingress host, the pod host, or the cluster service DNS name.
  ALLOWED_HOSTS: "localhost,127.0.0.1,eventhive.local,auth-service,booking-service,*.svc.cluster.local"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "eventhive_db"
  DB_USER: "root"
---
apiVersion: v1
kind: Secret
metadata:
  name: eventhive-secrets
type: Opaque
stringData:
  # Rotate these before any real deployment. Both services MUST receive the same
  # JWT_SIGNING_KEY or the booking service cannot verify auth-issued tokens.
  SECRET_KEY: "dev-insecure-key-scaler-capstone-9923847291"
  JWT_SIGNING_KEY: "dev-insecure-key-scaler-capstone-9923847291"
  DB_PASSWORD: "rootpassword"
