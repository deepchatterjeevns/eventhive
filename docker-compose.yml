services:
  mysql:
    image: mysql:8.0
    container_name: eventhive-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-eventhive_db}
    command: --default-authentication-plugin=mysql_native_password
    # Host port 3306 intentionally unmapped (Windows Docker port-bind race);
    # services reach MySQL via the docker network hostname "mysql".
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  auth_service:
    build: ./auth_service
    container_name: eventhive-auth
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-key-scaler-capstone-9923847291}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:-dev-insecure-key-scaler-capstone-9923847291}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,auth_service,booking_service}
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-eventhive_db}
      - DB_USER=${DB_USER:-root}
      - DB_PORT=3306
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput || true &&
             gunicorn auth_service.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  booking_service:
    build: ./booking_service
    container_name: eventhive-booking
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-key-scaler-capstone-9923847291}
      # Must equal the auth service value so Bearer tokens verify statelessly.
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:-dev-insecure-key-scaler-capstone-9923847291}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,auth_service,booking_service}
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-eventhive_db}
      - DB_USER=${DB_USER:-root}
      - DB_PORT=3306
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py init_data &&
             gunicorn booking_service.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8002:8000"
    depends_on:
      mysql:
        condition: service_healthy
      auth_service:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
