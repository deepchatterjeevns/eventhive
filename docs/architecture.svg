<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="ingressGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fefce8"/><stop offset="1" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="authGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="bookingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f2"/><stop offset="1" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="980" height="620" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">EventHive — System Architecture</text>

  <!-- Client -->
  <rect x="40" y="70" width="150" height="90" rx="10" fill="url(#clientGrad)" stroke="#6366f1" stroke-width="2"/>
  <text x="115" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">API Clients</text>
  <text x="115" y="124" text-anchor="middle" font-size="11" fill="#3730a3">Postman / curl</text>
  <text x="115" y="140" text-anchor="middle" font-size="11" fill="#3730a3">Mobile / Frontend</text>

  <!-- Ingress -->
  <rect x="330" y="70" width="180" height="90" rx="10" fill="url(#ingressGrad)" stroke="#ca8a04" stroke-width="2"/>
  <text x="420" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#713f12">K8s Ingress</text>
  <text x="420" y="119" text-anchor="middle" font-size="11" fill="#854d0e">nginx (ALB)</text>
  <text x="420" y="135" text-anchor="middle" font-size="11" fill="#854d0e">/auth(/|$)(.*) → auth-service:8001</text>
  <text x="420" y="150" text-anchor="middle" font-size="11" fill="#854d0e">/booking(/|$)(.*) → booking-service:8002</text>

  <!-- Auth Service -->
  <rect x="150" y="240" width="200" height="150" rx="10" fill="url(#authGrad)" stroke="#0891b2" stroke-width="2"/>
  <text x="250" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#155e75">Auth Service</text>
  <text x="250" y="286" text-anchor="middle" font-size="11" fill="#155e75">Django + DRF + SimpleJWT</text>
  <text x="250" y="304" text-anchor="middle" font-size="11" fill="#155e75">Register / Login</text>
  <text x="250" y="320" text-anchor="middle" font-size="11" fill="#155e75">Issues JWT access token</text>
  <text x="250" y="338" text-anchor="middle" font-size="11" fill="#155e75">Replica: 1</text>
  <text x="250" y="354" text-anchor="middle" font-size="11" fill="#155e75">Port 8000</text>

  <!-- Booking Service -->
  <rect x="470" y="240" width="230" height="150" rx="10" fill="url(#bookingGrad)" stroke="#e11d48" stroke-width="2"/>
  <text x="585" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#881337">Booking Service</text>
  <text x="585" y="286" text-anchor="middle" font-size="11" fill="#881337">Django + DRF</text>
  <text x="585" y="304" text-anchor="middle" font-size="11" fill="#881337">Stateless JWT validation (PyJWT)</text>
  <text x="585" y="320" text-anchor="middle" font-size="11" fill="#881337">select_for_update() pessimistic locking</text>
  <text x="585" y="338" text-anchor="middle" font-size="11" fill="#881337">Sorted ticket IDs (deadlock 1213 fix)</text>
  <text x="585" y="354" text-anchor="middle" font-size="11" fill="#881337">Replicas: 2 · Port 8000</text>

  <!-- MySQL -->
  <rect x="340" y="480" width="220" height="100" rx="10" fill="url(#dbGrad)" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="512" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">MySQL 8.0</text>
  <text x="450" y="532" text-anchor="middle" font-size="11" fill="#6d28d9">eventhive_db</text>
  <text x="450" y="550" text-anchor="middle" font-size="11" fill="#6d28d9">StatefulSet + PVC (5Gi)</text>
  <text x="450" y="566" text-anchor="middle" font-size="11" fill="#6d28d9">users / events / tickets / bookings</text>

  <!-- Arrows: Client -> Ingress -->
  <line x1="190" y1="115" x2="330" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="108" text-anchor="middle" font-size="10" fill="#555">HTTPS / HTTP</text>

  <!-- Arrows: Ingress -> Auth -->
  <line x1="360" y1="160" x2="250" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="202" text-anchor="middle" font-size="10" fill="#555">/auth</text>

  <!-- Arrows: Ingress -> Booking -->
  <line x1="490" y1="160" x2="585" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="202" text-anchor="middle" font-size="10" fill="#555">/booking</text>

  <!-- Auth -> MySQL -->
  <line x1="250" y1="390" x2="400" y2="480" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="440" text-anchor="middle" font-size="10" fill="#555">reads/writes users</text>

  <!-- Booking -> MySQL -->
  <line x1="585" y1="390" x2="500" y2="480" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="440" text-anchor="middle" font-size="10" fill="#555">row-level locks</text>

  <!-- JWT flow note -->
  <line x1="250" y1="240" x2="585" y2="240" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="417" y="233" text-anchor="middle" font-size="10" fill="#0e7490">shared SECRET_KEY (HS256)</text>

  <!-- Legend -->
  <rect x="760" y="420" width="200" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="860" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Legend</text>
  <line x1="775" y1="465" x2="825" y2="465" stroke="#555" stroke-width="2"/>
  <text x="832" y="469" font-size="11" fill="#334155">HTTP request</text>
  <line x1="775" y1="490" x2="825" y2="490" stroke="#555" stroke-width="1.5" stroke-dasharray="5,4" stroke-dashoffset="3"/>
  <text x="832" y="494" font-size="11" fill="#334155">JWT key sharing</text>
  <rect x="775" y="505" width="50" height="14" rx="4" fill="#ecfeff" stroke="#0891b2"/>
  <text x="832" y="516" font-size="11" fill="#334155">Auth Service</text>
  <rect x="775" y="527" width="50" height="14" rx="4" fill="#fff1f2" stroke="#e11d48"/>
  <text x="832" y="538" font-size="11" fill="#334155">Booking Service</text>
  <rect x="775" y="549" width="50" height="14" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="832" y="560" font-size="11" fill="#334155">MySQL DB</text>
  <rect x="775" y="571" width="50" height="14" rx="4" fill="#fefce8" stroke="#ca8a04"/>
  <text x="832" y="582" font-size="11" fill="#334155">Ingress</text>

  <text x="490" y="615" text-anchor="middle" font-size="10" fill="#94a3b8">Deployed on Kubernetes (AWS EKS / Minikube) · Docker Compose for local development</text>
</svg>
